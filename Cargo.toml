[package]
name = "sylvie"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nar1nari/sylvie"

[dependencies]
base64 = "0.22.1"
chrono = "0.4.42"
dotenvy = "0.15.7"
dotenvy_macro = "0.15.7"
fluent = { version = "0.17.0", features = ["fluent-pseudo"] }
gem-rs = "0.1.80"
intl-memoizer = "0.5.3"
lavalink-rs = { version = "0.14.2", features = ["serenity", "songbird"] }
once_cell = "1.21.3"
poise = "0.6.1"
rand = "0.9.2"
reqwest = { version = "0.12.24", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serenity = { version = "0.12.4", features = ["voice"] }
songbird = "0.4"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["v4"] }
